# ================================================================
#  ExamOfPVE 主配置文件
#  修改后请执行 /exam reload 重新加载（挑战倍率、提醒、暂停等全局设置会更新）
# ================================================================

# 是否输出调试日志
debug: false

# 全局设置
settings:
  # 考核中额外允许执行的命令（忽略大小写，按命令标签精确匹配）。
  # 例如 "/msg" 只放行 /msg 本身及其参数，不会放行 /msgfoo；
  # 也可以写 "/msg hello" 按完整前缀匹配。
  # 考核终止命令 /exam abort 会自动放行，无需在此填写。
  # 例如允许玩家在考核中私聊：
  # allowed-commands-during-exam:
  #   - "/msg"
  #   - "/tell"
  allowed-commands-during-exam: []

  # 点券发放命令模板（%player% = 玩家名，%amount% = 点券数）。
  # 用于"同时完成多个挑战"的点券奖励。留空则禁用点券奖励。
  voucher-command: "points give %player% %amount%"

  # /exam list 中是否隐藏未到开放时间的考核
  # （false = 全部显示，未开放的标注"未开放"；true = 不显示未开放的考核）
  list-hide-closed: false

  # 考核开放 / 结束开放的全服公告。
  # 公告内容在 messages.yml 的 exam-notification-open / exam-notification-close 中自定义，
  # 支持占位符 {exam}（显示名）、{id}（考核 ID）、{window}（开放时段）。
  exam-notifications:
    enabled: true
    # 音效名称使用 Bukkit Sound 枚举名；留空表示该事件不播放音效。
    sound:
      enabled: true
      open: "BLOCK_NOTE_BLOCK_PLING"
      close: "BLOCK_NOTE_BLOCK_BASS"
      volume: 1.0
      pitch: 1.0

  # 虚空传送：考核中的玩家 Y 坐标低于该值（1.21.11 虚空在 -64 以下）时，
  # 立即传送回考核出生点。
  void-teleport-y: -64.0

  # 考核暂停：连按指定按键 N 次触发暂停 / 取消暂停（按 1 次仅提示，N 次内完成则暂停）。
  # 注意：R/C/X/Z/V 等键位服务器端无法检测（原版协议不产生任何事件），
  # 因此改为"三击"（默认 pause-clicks-required: 3）来避免玩家游玩中误触。
  # 请勿设置为 Shift+F（该组合键被服务器用作打开菜单）。
  pause-enabled: true
  pause-key: "SNEAK"            # SNEAK(潜行/Shift，默认) / SPRINT(疾跑键) / SWAP(换手键/F)
  pause-clicks-required: 3      # 触发暂停所需连按次数（3 = 三击；2 = 双击）
  pause-click-window-ms: 700    # 连按判定窗口（毫秒，自第一次按下起算；旧配置键 pause-double-click-ms 仍兼容）
  pause-duration-seconds: 60    # 每次暂停时长（秒）
  max-pauses: 2                 # 每场考核最多暂停次数

  # 考核剩余时间提醒（秒）：剩余时间到达这些值时播放音效并发送提示
  time-warning-at: [60, 30, 10, 5]

  # 暂停剩余时间提醒（秒）：暂停剩余时间到达该值时播放音效并发送提示
  pause-warning-at: 5

  # 低血量提醒（最大生命百分比）：考核中生命值低于这些值时播放音效并发送提示
  low-health-warning-at: [20, 10]

  # 考核预备阶段（秒）：玩家传送至考核地图后先有准备时间，期间无法移动、
  # 怪物不会生成，倒计时结束才正式开始考核（计时与刷怪均从结束后起算）。0 = 关闭。
  prep-time-seconds: 5

# ----------------------------------------------------------------
#  挑战类型与奖励倍率（全局）
#  玩家可在考核前通过 /exam challenge <id> on|off 开启，多个挑战的
#  倍率相乘叠加（如两个 x1.2 叠加为 x1.44），并乘到金币与经验奖励上。
# ----------------------------------------------------------------
challenges:
  half-health: 1.4            # 生命值减半
  double-mobs: 1.7            # 怪物数量x2
  no-natural-regen: 1.7       # 禁止自然回血
  no-regen: 3.2               # 禁止任意形式回血（金苹果/药水等也不可）
  no-vanilla-tools: 1.5       # 禁用原版辅助道具（不死图腾/末影珍珠/鞘翅+烟花/药水）
  half-time: 2.0              # 考核限定时间减半
  no-weapon: 2.0              # 不允许使用剑、斧、重锤和矛
  no-armor: 5.0               # 不允许穿戴护甲

# ----------------------------------------------------------------
#  怪物池（可选）
#  怪物池用于让刷怪点位随机生成不同生物。池内每个条目是一种生物
#  （type 或 mythicmob），weight 为抽取权重（默认 1）。
#  - 每生成一只生物都会独立抽取一次，因此同一场考核可能混有多种生物；
#  - 每个点位都可以通过 pool 引用不同的命名怪物池；
#  - 也可以直接在点位里用 pool 内联一份列表（只对该点位生效）。
# ----------------------------------------------------------------
mob-pools:
  undead:
    - type: ZOMBIE
      weight: 3
    - type: SKELETON
      weight: 2
      name: "&7骷髅射手"       # 可选：该条目生成时的显示名称
    # MythicMobs 生物条目（需安装 MythicMobs，且名称存在）：
    # - mythicmob: "SkeletonKing"
    #   weight: 1
  # 字符串简写：原版生物名，权重默认为 1；MythicMobs 可写 "mythic:生物名"
  # simple:
  #   - "SPIDER"
  #   - "CAVE_SPIDER"
  #   - "mythic:ZombieLord"

# ----------------------------------------------------------------
#  考核定义
#  每个考核（exam1、exam2 ...）为一个配置节。
# ----------------------------------------------------------------
exams:

  # ---------------- 示例考核 1：原版生物 ----------------
  exam1:
    # 显示名称（用于提示信息，支持 & 颜色代码）
    display-name: "&a新手考核"

    # 该考核使用的地图（世界）列表。
    # 请预先在 Multiverse-Core 中导入多份相同地图（mv import ...），
    # 以便同一时间可有多名玩家同时进行考核。插件会从中挑选一个空闲世界。
    worlds:
      - "exam1_world"
      - "exam1_world_2"

    # 玩家进入考核后的出生点（相对考核世界，yaw/pitch 可省略）。
    # 若不配置，则使用世界的默认出生点。
    spawn:
      x: 0.5
      y: 100.0
      z: 0.5
      yaw: 0.0
      pitch: 0.0

    # 时间限制（秒）
    time-limit: 120

    # 可选：将玩家进入考核后强制设置的游戏模式（SURVIVAL/CREATIVE/ADVENTURE...）
    # game-mode: SURVIVAL

    # 开放时间窗口（现实时间，24 小时制，服务器时区）。可省略表示全天开放。
    # 支持非连续的多个时段，也支持跨午夜（如 23:00 ~ 01:00）：
    # open-window:
    #   - start: "08:00"
    #     end: "09:00"
    #   - start: "12:00"
    #     end: "13:00"
    # 旧版单时段写法同样兼容：
    # open-window:
    #   start: "13:00"
    #   end: "14:00"

    # 参加费用（金币，需 Vault + 经济插件；0 = 免费）。
    # 进入时扣除；仅考核场地加载失败时退还。
    entry-fee: 100.0

    # 可选：允许玩家携带的挑战列表（不配置 = 允许全部挑战）。
    # allowed-challenges:
    #   - half-health
    #   - double-mobs

    # 同时完成 N 个挑战的额外奖励（取 完成数 <= N 的最大档位）。
    # 每个档位可独立自定义：money 金币 / exp 经验 / points 点券（走 settings.voucher-command）/ commands 命令。
    # 例如：完成 3 个给 1000 金币，完成 5 个给 3 点券，完成 6 个给 VIP 权限：
    challenge-rewards:
      3:
        money: 1000.0
        exp: 0
        points: 0
        commands: []
      # 5:
      #   points: 3
      # 6:
      #   commands:
      #     - "lp user %player% parent add vip 3d"

    # 初次通过该考核时的额外奖励
    first-win-rewards:
      money: 200.0
      exp: 100
      commands:
        - "give %player% netherite_ingot 1"

    # 世界交互规则
    world-settings:
      # 是否允许破坏方块（true 时允许，考核结束后恢复原样）
      allow-break: false
      # 是否允许放置方块（true 时允许，考核结束后恢复原样）
      allow-place: false

    # 生物列表：考核开始后按 delay（秒，相对考核开始）依次生成，全部击杀即通过。
    # 每个点位可以直接指定 type / mythicmob、使用 pool 引用怪物池，
    # 或使用 region 在指定矩形区域内随机生成。
    mobs:
      - type: ZOMBIE          # 原版生物类型（EntityType 名称）
        amount: 3             # 数量
        delay: 0              # 生成时间：考核开始后第 0 秒
        x: 100.5
        y: 100.0
        z: 100.5
        # name: "&c小僵尸"    # 可选：自定义显示名称
      # 使用命名怪物池：每只都从 undead 池中按权重随机抽取
      - pool: "undead"
        amount: 2
        delay: 10
        x: 110.5
        y: 100.0
        z: 100.5
      # 也可以内联怪物池（只对当前点位生效）：
      # - pool:
      #     - type: SPIDER
      #     - type: CAVE_SPIDER
      #   amount: 2
      #   delay: 10
      #   x: 120.5
      #   y: 100.0
      #   z: 100.5
      #
      # 区域随机生成：在矩形区域内为每只生物随机挑选安全位置。
      # - 不会生成在方块内部（脚部 / 头部必须是空气等可通行位置，脚下需为固体方块）
      # - 同一区域点位内，相邻生成点保持至少 2 格距离；多次找不到位置后才会放宽间距
      # - region 字符串格式：x1,z1,x2,z2 或 x1,z1,x2,z2,min-y,max-y
      # - min-y / max-y 表示生物脚部所在 Y 的范围（含边界，可省略）
      # - 省略 Y 范围时，从该 X/Z 的最高方块向下找到第一块固体地面后在其上方生成
      # - 与 region 同时写 x/y/z 时，x/y/z 会被忽略
      # - type: ZOMBIE
      #   amount: 10
      #   delay: 0
      #   region: "0,0,100,100"
      # 或映射写法：
      # - type: ZOMBIE
      #   amount: 10
      #   delay: 0
      #   region:
      #     min-x: 0
      #     min-z: 0
      #     max-x: 100
      #     max-z: 100
      #     min-y: 60
      #     max-y: 100

    # 奖励（考核成功时发放，金币与经验会乘以最终挑战倍率）
    rewards:
      money: 100.0            # 金币（需 Vault + 经济插件）
      exp: 50                 # 经验值（经验点）
      commands:               # 自定义命令（以控制台身份执行，占位符见 README）
        - "give %player% diamond 1"

  # ---------------- 示例考核 2：MythicMobs + 允许修改地图 ----------------
  exam2:
    display-name: "&c进阶考核"
    worlds:
      - "exam2_world"
    time-limit: 180

    # 参加费用（0 = 免费）
    entry-fee: 0.0

    # 完成 3 个挑战给 2 点券（示例：与 exam1 的奖励独立设置）
    challenge-rewards:
      3:
        points: 2

    # 允许破坏/放置，考核结束后插件会自动恢复地图原样
    world-settings:
      allow-break: true
      allow-place: true

    mobs:
      # MythicMobs 生物（需安装 MythicMobs，且该生物名在 MythicMobs 中存在）
      - mythicmob: "SkeletonKing"
        amount: 1
        delay: 0
        x: 0.5
        y: 100.0
        z: 0.5

    rewards:
      money: 500.0
      exp: 100
      commands:
        - "broadcast &e%player% 通过了 %exam% 考核！"
